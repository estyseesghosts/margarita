name: Verify
on:
  push:
    # Both filters are required: defining only one of branches/tags stops the workflow from
    # running for the other kind of ref. Tags go through release.yml, which runs this same gate.
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run verify

  # The source gate above cannot notice a missing OpenTUI native library inside the compiled
  # executable. This job builds the real Linux x64 glibc binary, runs it from an unrelated
  # directory against a disposable stub service, and checks the renderer paints and exits
  # cleanly under a PTY. It never touches a user's OpenCode service or a paid model.
  executable-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build bun-linux-x64
      - name: Stage the binary outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/exe"
          cp dist/marg "$RUNNER_TEMP/exe/marg"
          (cd "$RUNNER_TEMP/exe" && sha256sum marg | tee marg.sha256)
          ldd "$RUNNER_TEMP/exe/marg" || true
      - name: Smoke test --help and --version from an unrelated directory
        working-directory: ${{ runner.temp }}/exe
        run: |
          ./marg --version
          ./marg --help > /dev/null
      - name: POSIX PTY scenarios (keys, mouse, editor, signals, resize)
        run: sh scripts/test-pty-smoke.sh "$RUNNER_TEMP/exe/marg"
      - name: tmux semantic smoke (Unicode, paste, F1, resize)
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
          sh scripts/test-tmux.sh "$RUNNER_TEMP/exe/marg"
      - name: Low-disk state write on a tiny tmpfs
        run: sh scripts/test-low-disk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: marg-linux-x64
          path: |
            ${{ runner.temp }}/exe/marg
            ${{ runner.temp }}/exe/marg.sha256

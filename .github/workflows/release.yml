name: Release

# Publishing runs from an annotated tag (`v*`); the manual trigger re-runs a release that
# failed after the tag was already pushed. `verify.yml` ignores tags so this is the only
# gate a release build passes through.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # A release must never expose an artifact that the source gate rejects.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run verify

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            binary: marg
            asset: marg-linux-x64
          - os: windows-latest
            target: bun-windows-x64
            binary: marg.exe
            asset: marg-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build ${{ matrix.target }}
      - name: Stage the artifact outside the checkout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp "dist/${{ matrix.binary }}" "$RUNNER_TEMP/release/${{ matrix.asset }}"
          cd "$RUNNER_TEMP/release"
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - name: Smoke test from an unrelated directory
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}/release
        run: |
          .\marg-windows-x64.exe --version
          .\marg-windows-x64.exe --help > $null
      - name: Interactive PTY smoke against a disposable stub service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export STUB_LOG="$RUNNER_TEMP/stub.log"
          bun test/smoke/stub-server.ts "$RUNNER_TEMP/port" &
          for _ in $(seq 1 50); do [ -s "$RUNNER_TEMP/port" ] && break; sleep 0.2; done
          url="http://127.0.0.1:$(cat "$RUNNER_TEMP/port")"
          for scenario in ctrl-c keys mouse editor editor-fail sigterm resize; do
            python3 test/smoke/pty-smoke.py "$RUNNER_TEMP/release/marg-linux-x64" "$url" "$scenario"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify checksums before publishing
        working-directory: release-assets
        run: |
          for file in *.sha256; do sha256sum --check "$file"; done
          ls -l
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
